<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料查詢系統</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:24px 16px;background:#f0f5f4;color:#1f2d2d;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:22px;color:#2f6f6b;margin:0 0 16px}
  .bar{display:flex;gap:8px;flex-wrap:wrap}
  input{flex:1;min-width:160px;padding:12px;font-size:16px;border:1px solid #b8c9c7;border-radius:8px}
  button{padding:12px 22px;font-size:16px;color:#fff;background:#2f6f6b;border:0;border-radius:8px;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  #code{display:none;flex:0 0 140px;min-width:120px}
  #status{margin:14px 0;color:#667;font-size:15px}
  #status.err{color:#b00020}
  .scroll{overflow-x:auto;background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
  table{border-collapse:collapse;width:100%;font-size:15px}
  th{background:#2f6f6b;color:#fff;text-align:left;padding:10px;white-space:nowrap}
  td{padding:10px;border-bottom:1px solid #e3ecea}
  tr:hover td{background:#f4faf9}
</style>
</head>
<body>
<div class="wrap">
  <h1>資料查詢系統</h1>
  <div class="bar">
    <input id="q" placeholder="請輸入關鍵字（如：姓名、單位…）" autocomplete="off">
    <input id="code" type="password" placeholder="查詢密碼">
    <button id="btn">搜尋</button>
  </div>
  <div id="status"></div>
  <div id="result"></div>
</div>

<script>
// ──────────────────────────────────────────
// ⚙ 設定：填入你的 Google Apps Script Web App URL
// ──────────────────────────────────────────
const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxXYlEUhHSg1LB0Nd0-GN8NP333N9HRDu1dhLdkIElOg-N2_MyGqaO5QS7dVcBiaBRZ/exec";

// 若後台 ACCESS_CODE 有設定密碼，請改為 true，畫面會出現密碼欄
const NEED_CODE = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
if (NEED_CODE) $("code").style.display = "block";

async function search() {
  const q = $("q").value.trim();
  const status = $("status"), result = $("result");
  result.innerHTML = "";
  status.className = "";
  if (!q) { status.className = "err"; status.textContent = "請輸入關鍵字"; return; }

  $("btn").disabled = true;
  status.textContent = "查詢中…";
  try {
    let url = GOOGLE_SHEET_URL + "?q=" + encodeURIComponent(q);
    if (NEED_CODE) url += "&code=" + encodeURIComponent($("code").value);
    const data = await (await fetch(url)).json();

    if (data.status !== "success") {
      status.className = "err";
      status.textContent = data.message;
      return;
    }
    status.textContent = "共找到 " + data.rows.length + " 筆資料";
    result.innerHTML = '<div class="scroll"><table><thead><tr>' +
      data.headers.map(h => "<th>" + esc(h) + "</th>").join("") + "</tr></thead><tbody>" +
      data.rows.map(r => "<tr>" + r.map(c => "<td>" + esc(c) + "</td>").join("") + "</tr>").join("") +
      "</tbody></table></div>";
  } catch (e) {
    status.className = "err";
    status.textContent = "連線失敗，請確認網址設定與部署權限（任何人）";
  } finally {
    $("btn").disabled = false;
  }
}

$("btn").addEventListener("click", search);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
</script>
</body>
</html>
